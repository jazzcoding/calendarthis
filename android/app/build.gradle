plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.calendarthis.calendar_this"
    compileSdk = 36  // Updated to match plugin requirements
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Enable core library desugaring to support Java 8+ language features
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.calendarthis.calendar_this"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        //minSdkVersion = flutter.minSdkVersion // Set explicitly to ensure compatibility
        //targetSdk = 35 // Match compileSdk
        //versionCode = flutter.versionCode
        //versionName = flutter.versionName
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
            storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
            storePassword keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release

            // Enable ProGuard with our custom rules
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Add the desugaring dependency
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'
    // ML Kit dependencies removed
    // Play Feature Delivery / Asset Delivery (replacement for Play Core)
    implementation 'com.google.android.play:feature-delivery:2.1.0'
    implementation 'com.google.android.play:asset-delivery:2.2.1'
    implementation 'com.google.android.play:core-common:2.0.4'
}
